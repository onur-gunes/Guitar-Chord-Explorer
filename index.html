<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Guitar Chord Explorer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1014;
  --panel: #14181f;
  --panel2: #191f28;
  --border: #242c37;
  --border2: #323c4b;
  --text: #e9edf3;
  --muted: #98a2b3;
  --dim: #828d9e;
  --accent: #f2b544;
  --accent-ink: #14171d;
  --wo: #1b222c;
  --wi: #151b24;
  --wo-h: #252f3d;
  --wi-h: #1e2733;
}
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  background: radial-gradient(1100px 560px at 50% -12%, #191f2a 0%, var(--bg) 62%) fixed, var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 22px 70px; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding: 26px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 26px;
}
h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.tuning {
  font-size: 12px; letter-spacing: 0.2em; color: var(--muted);
  border: 1px solid var(--border); background: var(--panel);
  padding: 7px 14px; border-radius: 999px; white-space: nowrap;
}
main { display: grid; grid-template-columns: 400px 1fr; gap: 34px; align-items: start; }
.circle-panel { position: sticky; top: 14px; }
.circle-panel svg { display: block; width: 100%; height: auto; }
.hint-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 8px; font-size: 12.5px; color: var(--muted);
}
.acc-btn {
  font: inherit; font-size: 12.5px; color: var(--accent);
  background: transparent; border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.acc-btn:hover { border-color: var(--accent); background: rgba(242,181,68,.08); }
.wg { stroke: var(--bg); stroke-width: 2.5; cursor: pointer; transition: fill .15s ease; }
.wmaj { fill: var(--wo); }
.wmin { fill: var(--wi); }
[data-kind]:not(.sel):hover .wg { fill: var(--wo-h); }
[data-kind="min"]:not(.sel):hover .wg { fill: var(--wi-h); }
[data-kind]:focus { outline: none; }
[data-kind]:focus-visible .wg { stroke: var(--accent); stroke-width: 3; }
.lbl-o { fill: #dde4ee; font-size: 16px; font-weight: 600; pointer-events: none; }
.lbl-i { fill: #93a0b4; font-size: 12.5px; font-weight: 500; pointer-events: none; }
.sel .wg { fill: var(--accent); }
.sel .lbl-o, .sel .lbl-i { fill: var(--accent-ink); font-weight: 700; }
.ctr { fill: #0f131a; stroke: var(--border); stroke-width: 1.5; }
.ctr-name { font-size: 28px; font-weight: 700; text-anchor: middle; fill: var(--text); }
.ctr-name .rt { fill: var(--accent); }
.ctr-notes { font-size: 11.5px; text-anchor: middle; fill: var(--muted); letter-spacing: .07em; }
.label {
  font-size: 11.5px; font-weight: 650; text-transform: uppercase;
  letter-spacing: 0.15em; color: var(--dim); margin-bottom: 11px;
}
.block { margin-bottom: 24px; }
.chips { display: grid; gap: 16px; }
.chip-group .cg-label {
  font-size: 11px; font-weight: 650; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--dim); margin: 0 2px 9px;
}
.chip-group .cg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 13.5px; padding: 7px 15px; cursor: pointer;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
  color: var(--muted); transition: color .15s, border-color .15s, background .15s;
}
.chip:hover { color: var(--text); border-color: var(--border2); }
.chip.active {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 650;
}
.notes { display: flex; flex-wrap: wrap; gap: 9px; }
.note {
  min-width: 56px; text-align: center; background: var(--panel);
  border: 1px solid var(--border); border-radius: 11px; padding: 7px 10px 6px;
}
.note b { display: block; font-size: 15.5px; font-weight: 650; }
.note.root b { color: var(--accent); }
.note span { display: block; font-size: 10.5px; color: var(--dim); margin-top: 2px; }
.shapes-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 30px 0 15px; padding-top: 24px; border-top: 1px solid var(--border);
}
.shapes-head h3 { font-size: 15.5px; font-weight: 600; }
.shapes-head h3 .cn { color: var(--accent); }
.toggle-btn { font-size: 11px; color: var(--dim); background: var(--panel2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; cursor: pointer; margin-left: 10px; }
.toggle-btn:hover { border-color: var(--border2); }
.shapes-head .cnt { font-size: 13px; color: var(--muted); white-space: nowrap; }
.shapes {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(134px, 1fr)); gap: 14px;
}
.shape {
  background: var(--panel); border: 1px solid var(--border); border-radius: 15px;
  padding: 16px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px;
  transition: border-color .15s, transform .15s;
  animation: rise .3s ease backwards;
}
.shape svg { visibility: visible !important; opacity: 1 !important; }
.shape:hover { border-color: var(--border2); transform: translateY(-2px); }
.shape svg { width: 100%; max-width: 150px; height: auto; display: block; }
.more { grid-column: 1/-1; text-align: center; padding: 16px; color: var(--muted); font-size: 12px; }
.snum {
  fill: #828d9e; font-size: 10.5px; font-weight: 600;
  text-anchor: middle; dominant-baseline: middle;
  font-variant-numeric: tabular-nums;
}
.st { stroke: #5f6d80; stroke-width: 1.4; }
.fw { stroke: #4c5765; stroke-width: 1.4; }
.nut { stroke: #c9d2df; stroke-width: 4.5; stroke-linecap: round; }
.dot, .bar { fill: var(--accent); }
.oc { fill: none; stroke: #77829a; stroke-width: 1.7; }
.pos {
  fill: #828d9e; font-size: 11px; font-weight: 700;
  text-anchor: middle; dominant-baseline: central;
}
.muted {
  fill: #98a2b3; font-size: 15px; font-weight: 800;
  text-anchor: middle; dominant-baseline: middle;
}
.find-block { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 15px; }
.find-strings { display: flex; gap: 8px; }
.fstr { flex: 1; min-width: 0; }
.fstr span {
  display: block; text-align: center; font-size: 11px; font-weight: 600;
  color: var(--dim); letter-spacing: 0.1em; margin-bottom: 5px;
}
.fsel {
  width: 100%; font: inherit; font-size: 16px; color: var(--text);
  background: var(--panel2); border: 1px solid var(--border); border-radius: 11px;
  padding: 9px 4px; text-align: center; outline: none; cursor: pointer;
  appearance: none; -webkit-appearance: none;
  transition: border-color .15s, background .15s;
}
.fsel:focus { border-color: var(--accent); }
.find-sub { font-size: 11.5px; color: var(--dim); margin-top: 9px; }
.find-out { margin-top: 11px; min-height: 30px; }
.find-hit-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.find-out .find-hit { font-size: 13.5px; padding: 6px 16px; cursor: pointer; }
.find-hit-hint { font-size: 11.5px; color: var(--dim); }
.find-err { font-size: 12.5px; color: #e0897c; }
.empty {
  grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 14px;
  border: 1px dashed var(--border); border-radius: 15px; padding: 30px 18px;
}
@keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
@media (max-width: 940px) {
  main { grid-template-columns: 1fr; gap: 26px; }
  .circle-panel { position: static; max-width: 380px; margin: 0 auto; width: 100%; }
  header { flex-direction: column; align-items: flex-start; gap: 12px; }
}
@media (max-width: 480px) {
  .wrap { padding: 0 14px 56px; }
  .shapes { grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); gap: 11px; }
  .chip { font-size: 13px; padding: 6px 13px; }
  .fsel { font-size: 17px; padding: 11px 4px; }
  .find-strings { gap: 6px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Guitar Chord Explorer</h1>
      <div class="sub">Every way to play any chord, on every fret</div>
    </div>
    <div class="meta">
      <div class="tuning" title="Standard tuning">E &nbsp;A &nbsp;D &nbsp;G &nbsp;B &nbsp;E</div>
    </div>
  </header>
  <main>
    <section class="circle-panel" id="circlePanel"></section>
    <section class="info-panel" id="infoPanel">
      <div class="block">
        <div class="label">Chord type</div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="block">
        <div class="label">Notes</div>
        <div class="notes" id="notes"></div>
      </div>
      <div class="shapes-head">
        <h3><span class="cn" id="shapeName">C</span></h3>
        <div class="cnt" id="shapeCount"></div><button class="toggle-btn" id="allBtn" type="button">Show all</button>
      </div>
      <div class="shapes" id="shapes"></div>
    </section>
  </main>
</div>
<script>
(function () {
  var TUNING = [40, 45, 50, 55, 59, 64];
  var MAX_FRET = 11;
  var LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  var LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
  var ACC_STR = { '-2': '\u266d\u266d', '-1': '\u266d', 0: '', 1: '\u266f', 2: '\u266f\u266f' };
  var ENHARMONIC = { 1: ['C\u266f', 'D\u266d'], 3: ['D\u266f', 'E\u266d'], 6: ['F\u266f', 'G\u266d'], 8: ['G\u266f', 'A\u266d'], 10: ['A\u266f', 'B\u266d'] };

  var TYPES = [
    { id: 'maj', label: 'major', suffix: '', degrees: ['root', '3', '5'], tones: [[0, 0], [4, 2], [7, 4]] },
    { id: 'm', label: 'minor', suffix: 'm', degrees: ['root', '\u266d3', '5'], tones: [[0, 0], [3, 2], [7, 4]] },
    { id: '7', label: '7', suffix: '7', degrees: ['root', '3', '5', '\u266d7'], tones: [[0, 0], [4, 2], [7, 4], [10, 6]] },
    { id: 'maj7', label: 'maj7', suffix: 'maj7', degrees: ['root', '3', '5', '7'], tones: [[0, 0], [4, 2], [7, 4], [11, 6]] },
    { id: 'm7', label: 'm7', suffix: 'm7', degrees: ['root', '\u266d3', '5', '\u266d7'], tones: [[0, 0], [3, 2], [7, 4], [10, 6]] },
    { id: 'sus4', label: 'sus4', suffix: 'sus4', degrees: ['root', '4', '5'], tones: [[0, 0], [5, 3], [7, 4]] },
    { id: 'sus2', label: 'sus2', suffix: 'sus2', degrees: ['root', '2', '5'], tones: [[0, 0], [2, 1], [7, 4]] },
    { id: '7sus4', label: '7sus4', suffix: '7sus4', degrees: ['root', '4', '5', '\u266d7'], tones: [[0, 0], [5, 3], [7, 4], [10, 6]] },
    { id: '6', label: '6', suffix: '6', degrees: ['root', '3', '5', '6'], tones: [[0, 0], [4, 2], [7, 4], [9, 5]] },
    { id: 'm6', label: 'm6', suffix: 'm6', degrees: ['root', '\u266d3', '5', '6'], tones: [[0, 0], [3, 2], [7, 4], [9, 5]] },
    { id: '9', label: '9', suffix: '9', degrees: ['root', '3', '5', '\u266d7', '9'], tones: [[0, 0], [4, 2], [7, 4], [10, 6], [14, 8]] },
    { id: 'm9', label: 'm9', suffix: 'm9', degrees: ['root', '\u266d3', '5', '\u266d7', '9'], tones: [[0, 0], [3, 2], [7, 4], [10, 6], [14, 8]] },
    { id: 'maj9', label: 'maj9', suffix: 'maj9', degrees: ['root', '3', '5', '7', '9'], tones: [[0, 0], [4, 2], [7, 4], [11, 6], [14, 8]] },
    { id: 'add9', label: 'add9', suffix: 'add9', degrees: ['root', '3', '5', '9'], tones: [[0, 0], [4, 2], [7, 4], [14, 8]] },
    { id: 'dim', label: 'dim', suffix: 'dim', degrees: ['root', '\u266d3', '\u266d5'], tones: [[0, 0], [3, 2], [6, 4]] },
    { id: 'dim7', label: 'dim7', suffix: 'dim7', degrees: ['root', '\u266d3', '\u266d5', '\u266d\u266d7'], tones: [[0, 0], [3, 2], [6, 4], [9, 6]] },
    { id: 'aug', label: 'aug', suffix: 'aug', degrees: ['root', '3', '\u266f5'], tones: [[0, 0], [4, 2], [8, 4]] },
    { id: 'm7b5', label: 'm7\u266d5', suffix: 'm7\u266d5', degrees: ['root', '\u266d3', '\u266d5', '\u266d7'], tones: [[0, 0], [3, 2], [6, 4], [10, 6]] }
  ];
  var MINOR_IDS = ['m', 'm7', 'm6', 'm9', 'm7b5'];
  var CIRCLE = [
    { maj: ['C'], min: ['Am'] },
    { maj: ['G'], min: ['Em'] },
    { maj: ['D'], min: ['Bm'] },
    { maj: ['A'], min: ['F\u266fm'] },
    { maj: ['E'], min: ['C\u266fm'] },
    { maj: ['B'], min: ['G\u266fm'] },
    { maj: ['F\u266f', 'G\u266d'], min: ['D\u266fm', 'E\u266dm'] },
    { maj: ['D\u266d'], min: ['B\u266dm'] },
    { maj: ['A\u266d'], min: ['Fm'] },
    { maj: ['E\u266d'], min: ['Cm'] },
    { maj: ['B\u266d'], min: ['Gm'] },
    { maj: ['F'], min: ['Dm'] }
  ];

  var state = { rootPc: 0, rootName: 'C', quality: 'maj', spelling: 'sharp', showAll: false };

  function typeOf(id) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return TYPES[i];
    return TYPES[0];
  }
  function parseName(n) {
    var s = n;
    if (s.length > 1 && s.charAt(s.length - 1) === 'm') s = s.slice(0, -1);
    var li = LETTERS.indexOf(s.charAt(0));
    var alt = 0;
    if (s.charAt(1) === '\u266f') alt = 1;
    else if (s.charAt(1) === '\u266d') alt = -1;
    var pc = ((LETTER_PC[li] + alt) % 12 + 12) % 12;
    return { pc: pc, letter: li, alt: alt };
  }
  function noteName(rootPc, rootLetter, tone) {
    var target = (rootPc + tone[0]) % 12;
    var li = (rootLetter + tone[1]) % 7;
    var d = target - LETTER_PC[li];
    if (d > 6) d -= 12;
    if (d < -6) d += 12;
    return LETTERS[li] + (ACC_STR[String(d)] || '');
  }
  function chordNotes() {
    var t = typeOf(state.quality);
    var p = parseName(state.rootName);
    return t.tones.map(function (tone, i) {
      return { name: noteName(state.rootPc, p.letter, tone), degree: t.degrees[i] };
    });
  }
  function playable(frets, relaxed) {
    var fretted = [];
    var sounding = 0;
    for (var i = 0; i < 6; i++) {
      if (frets[i] > 0) fretted.push(frets[i]);
      if (frets[i] >= 0) sounding++;
    }
    if (sounding < 3) return false;
    if (!fretted.length) return true;
    var uniq = fretted.filter(function (v, i) { return fretted.indexOf(v) === i; });
    var span = Math.max.apply(null, fretted) - Math.min.apply(null, fretted);
    var maxFingers = relaxed ? 5 : 4;
    var maxSpan = relaxed ? 6 : 4;
    if (uniq.length > maxFingers) return false;
    if (span > maxSpan) return false;
    return true;
  }
  function spanOf(arr) {
    var nz = arr.filter(function (v) { return v > 0; });
    if (!nz.length) return 0;
    return Math.max.apply(null, nz) - Math.min.apply(null, nz);
  }
  function findShapes(rootPc, quality, relaxed) {
    var tones = typeOf(quality).tones;
    var allowed = {}, essential = {};
    for (var ti = 0; ti < tones.length; ti++) {
      allowed[(rootPc + tones[ti][0]) % 12] = true;
      if (ti !== 2) essential[(rootPc + tones[ti][0]) % 12] = true;
    }
    var cand = [];
    for (var s = 0; s < 6; s++) {
      var list = [-1];
      for (var f = 0; f <= MAX_FRET; f++) {
        if (allowed[(TUNING[s] + f) % 12]) list.push(f);
      }
      cand.push(list);
    }
    var maxFingers = relaxed ? 5 : 4;
    var maxSpan = relaxed ? 6 : 4;
    var out = [], seen = {}, cur = [0, 0, 0, 0, 0, 0], used = {};
    function rec(s, minF, maxF, count) {
      if (count > maxFingers || maxF - minF > maxSpan) return;
      if (s === 6) {
        if (!playable(cur, relaxed)) return;
        var present = {}, sounding = 0, distinct = 0;
        for (var i = 0; i < 6; i++) {
          if (cur[i] < 0) continue;
          sounding++;
          var pc = (TUNING[i] + cur[i]) % 12;
          if (!present[pc]) { present[pc] = true; distinct++; }
        }
        if (sounding < 3 || distinct < 3) return;
        for (var e in essential) if (!present[e]) return;
        var key = cur.join(',');
        if (!seen[key]) { seen[key] = true; out.push(cur.slice()); }
        return;
      }
      var cl = cand[s];
      for (var k = 0; k < cl.length; k++) {
        var v = cl[k];
        cur[s] = v;
        if (v > 0) {
          var add = !used[v];
          if (add) used[v] = 1;
          rec(s + 1, v < minF ? v : minF, v > maxF ? v : maxF, count + (add ? 1 : 0));
          if (add) delete used[v];
        } else {
          rec(s + 1, minF, maxF, count);
        }
      }
    }
    rec(0, Infinity, -Infinity, 0);
    return out;
  }
  function diagramSVG(frets) {
    var num = frets.length || 6;
    var W = num === 6 ? 160 : 104;
    var padX = 22, fg = 21;
    var gap = (W - 2 * padX) / (num - 1);
    var nz = frets.filter(function (f) { return f > 0; });
    var minF = nz.length ? Math.min.apply(null, nz) : 0;
    
    var hasMark = frets.some(function (v) { return v <= 0; });
    var maxF = Math.max.apply(null, frets.filter(function(f){return f>0;})) || 0;
    var lo = maxF <= 4 ? 0 : Math.max(minF - 1, 0);
    var showNut = lo === 0;
    var hi = Math.max(maxF + 1, lo + 4);
    var rows = hi - lo;
    var top = hasMark ? 26 : 16;
    var markY = top - 11;
    var H = top + rows * fg + 10;
    var yWire = function (f) { return top + (f - lo) * fg; };
    var yDot = function (f) { return top + (f - lo) * fg - fg / 2; };
    var xStr = function (i) { return padX + i * gap; };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    var strTop = yWire(lo);
    for (var i = 0; i < num; i++) {
      s += '<line class="st" x1="' + xStr(i) + '" y1="' + strTop + '" x2="' + xStr(i) + '" y2="' + yWire(hi) + '"/>';
    }
    for (var f = showNut ? 1 : lo; f <= hi; f++) {
      s += '<line class="fw" x1="' + (xStr(0) - 6) + '" y1="' + yWire(f) + '" x2="' + (xStr(num - 1) + 6) + '" y2="' + yWire(f) + '"/>';
    }
    if (showNut) {
      s += '<line class="nut" x1="' + (xStr(0) - 6) + '" y1="' + yWire(0) + '" x2="' + (xStr(num - 1) + 6) + '" y2="' + yWire(0) + '"/>';
    } else {
      s += '<text class="pos" x="9" y="' + (yWire(lo) + fg / 2) + '">' + (lo + 1) + '</text>';
    }
    var covered = {};
    (function () {
      var fretted = frets.filter(function (v) { return v > 0; });
      if (!fretted.length) return;
      var mf = Math.min.apply(null, fretted);
      var idxs = [];
      frets.forEach(function (v, idx) { if (v === mf) idxs.push(idx); });
      if (idxs.length < 2) return;
      var lo2 = idxs[0], hi2 = idxs[idxs.length - 1], okBar = true;
      for (var k = lo2; k <= hi2; k++) {
        if (frets[k] === 0 || frets[k] === -1) { okBar = false; break; }
      }
      if (!okBar) return;
      if (idxs.length < 3 && (hi2 - lo2 + 1) === idxs.length) return;
      var x1 = xStr(lo2), x2 = xStr(hi2);
      s += '<rect class="bar" x="' + (x1 - 7) + '" y="' + (yDot(mf) - 7) + '" width="' + (x2 - x1 + 14) + '" height="14" rx="7"/>';
      idxs.forEach(function (ix) { covered[ix] = 1; });
    })();
    frets.forEach(function (fr, idx) {
      if (covered[idx]) return;
      if (fr === 0) s += '<circle class="oc" cx="' + xStr(idx) + '" cy="' + markY + '" r="4.5"/>';
      else if (fr === -1) s += '<text class="muted" x="' + xStr(idx) + '" y="' + markY + '" text-anchor="middle">×</text>';
      else s += '<circle class="dot" cx="' + xStr(idx) + '" cy="' + yDot(fr) + '" r="7"/>';
    });
    return s + '</svg>';
  }
  function fretLabelsSVG(frets) {
    var num = frets.length || 6;
    var W = num === 6 ? 160 : 104;
    var padX = 22;
    var gap = (W - 2 * padX) / (num - 1);
    var H = 14;
    var s = '<svg class="flabels" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
    for (var i = 0; i < num; i++) {
      var label = frets[i] < 0 ? 'x' : String(frets[i]);
      s += '<text class="snum" x="' + (padX + i * gap) + '" y="' + (H / 2) + '">' + label + '</text>';
    }
    return s + '</svg>';
  }

  function polar(r, deg) {
    var a = deg * Math.PI / 180;
    return [200 + r * Math.cos(a), 200 + r * Math.sin(a)];
  }
  function fx(n) { return n.toFixed(1); }
  function sector(r1, r2, a1, a2) {
    var p = polar(r2, a1), q = polar(r2, a2), r = polar(r1, a2), s = polar(r1, a1);
    return 'M' + fx(p[0]) + ' ' + fx(p[1]) +
      'A' + r2 + ' ' + r2 + ' 0 0 1 ' + fx(q[0]) + ' ' + fx(q[1]) +
      'L' + fx(r[0]) + ' ' + fx(r[1]) +
      'A' + r1 + ' ' + r1 + ' 0 0 0 ' + fx(s[0]) + ' ' + fx(s[1]) + 'Z';
  }
  function pickName(arr) {
    if (arr.length === 1) return arr[0];
    return state.spelling === 'sharp' ? arr[0] : arr[1];
  }
  var MAJOR_PCS = CIRCLE.map(function (e) { return parseName(e.maj[0]).pc; });
  var MINOR_PCS = CIRCLE.map(function (e) { return parseName(e.min[0]).pc; });

  function buildCircle() {
    var s = '<svg viewBox="0 0 400 400" role="group" aria-label="Circle of fifths">';
    CIRCLE.forEach(function (entry, i) {
      var a1 = -105 + i * 30, a2 = a1 + 30, mid = a1 + 15;
      var majName = pickName(entry.maj), minName = pickName(entry.min);
      var o = polar(159, mid), m = polar(103, mid);
      s += '<g data-kind="maj" data-i="' + i + '" tabindex="0" role="button" aria-label="' + majName + ' major">' +
        '<path class="wg wmaj" d="' + sector(132, 186, a1, a2) + '"/>' +
        '<text class="lbl-o" x="' + fx(o[0]) + '" y="' + fx(o[1]) + '" dominant-baseline="middle" text-anchor="middle">' + majName + '</text></g>';
      s += '<g data-kind="min" data-i="' + i + '" tabindex="0" role="button" aria-label="' + minName + ' minor">' +
        '<path class="wg wmin" d="' + sector(76, 130, a1, a2) + '"/>' +
        '<text class="lbl-i" x="' + fx(m[0]) + '" y="' + fx(m[1]) + '" dominant-baseline="middle" text-anchor="middle">' + minName + '</text></g>';
    });
    s += '<circle class="ctr" cx="200" cy="200" r="74"/>' +
      '<text class="ctr-name" id="ctrName" x="200" y="196"></text>' +
      '<text class="ctr-notes" id="ctrNotes" x="200" y="221"></text></svg>';
    document.getElementById('circlePanel').innerHTML =
      s + '<div class="hint-row"><span>Outer ring: major &nbsp;&middot;&nbsp; inner ring: relative minor</span>' +
      '<button class="acc-btn" id="accBtn" type="button"></button></div>' +
      '<div class="find-block">' +
      '<div class="label">Find chord by frets</div>' +
      '<div class="find-strings">' +
      ['E', 'A', 'D', 'G', 'B', 'E'].map(function (letter, i) {
        var opts = [];
        for (var k = 0; k <= MAX_FRET; k++) opts.push('<option value="' + k + '"' + (findVals[i] === k ? ' selected' : '') + '>' + k + '</option>');
        return '<label class="fstr"><span>' + letter + '</span><select class="fsel" id="f' + i + '" aria-label="' + letter + ' string fret">' + opts.join('') + '</select></label>';
      }).join('') +
      '</div>' +
      '<div class="find-sub">Set each string\u2019s fret \u2014 the chord is shown as you pick</div>' +
      '<div class="find-out" id="findOut"></div>' +
      '</div>';
    document.getElementById('accBtn').addEventListener('click', onAcc);
    for (var fi = 0; fi < 6; fi++) {
      document.getElementById('f' + fi).addEventListener('change', function () {
        updateFindVals();
        findFrets();
      });
    }
    findFrets();
  }

  function buildChips() {
    var GROUPS = [
      { name: 'Major', ids: ['maj', 'maj7', '7', '6', '9', 'maj9', 'add9', 'aug'] },
      { name: 'Minor', ids: ['m', 'm7', 'm6', 'm9', 'm7b5', 'dim', 'dim7'] },
      { name: 'Suspended', ids: ['sus4', 'sus2', '7sus4'] }
    ];
    document.getElementById('chips').innerHTML = GROUPS.map(function (g) {
      return '<div class="chip-group"><div class="cg-label">' + g.name + '</div><div class="cg-chips">' +
        g.ids.map(function (id) {
          var t = typeOf(id);
          return '<button class="chip" type="button" data-id="' + id + '">' + t.label + '</button>';
        }).join('') +
        '</div></div>';
    }).join('');
  }

  function setRoot(nm) {
    var p = parseName(nm);
    state.rootPc = p.pc;
    state.rootName = (nm.length > 1 && nm.charAt(nm.length - 1) === 'm') ? nm.slice(0, -1) : nm;
    if (nm.indexOf('\u266d') >= 0) state.spelling = 'flat';
    else if (nm.indexOf('\u266f') >= 0) state.spelling = 'sharp';
  }
  function pick(g) {
    var i = Number(g.getAttribute('data-i'));
    var entry = CIRCLE[i];
    if (g.getAttribute('data-kind') === 'maj') {
      setRoot(pickName(entry.maj));
      if (state.quality === 'm') state.quality = 'maj';
    } else {
      setRoot(pickName(entry.min));
      state.quality = 'm';
    }
    render();
    if (window.matchMedia('(max-width: 940px)').matches) {
      document.getElementById('infoPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  function onAcc() {
    var list = ENHARMONIC[state.rootPc];
    if (!list) return;
    state.spelling = state.spelling === 'sharp' ? 'flat' : 'sharp';
    state.rootName = list[state.spelling === 'sharp' ? 0 : 1];
    buildCircle();
    render();
  }

  var findVals = [0, 2, 2, 2, 0, 2];
  var PC_LETTER = { 0: 'C', 2: 'D', 4: 'E', 5: 'F', 7: 'G', 9: 'A', 11: 'B' };
  function uniqSorted(arr) {
    var u = [];
    arr.forEach(function (v) { if (u.indexOf(v) < 0) u.push(v); });
    return u.sort(function (a, b) { return a - b; });
  }
  function pcsOf(frets) {
    return frets.map(function (v, i) { return (TUNING[i] + v) % 12; });
  }
  function candidates(frets) {
    var S = uniqSorted(pcsOf(frets));
    var out = [];
    TYPES.forEach(function (t) {
      if (t.tones.length > 4) return;
      var tset = uniqSorted(t.tones.map(function (x) { return x[0] % 12; }));
      if (tset.length !== S.length) return;
      S.forEach(function (R) {
        for (var i = 0; i < tset.length; i++) if (S.indexOf((R + tset[i]) % 12) < 0) return;
        out.push({ pc: R, type: t });
      });
    });
    if (!out.length) {
      TYPES.forEach(function (t) {
        if (t.tones.length <= 4) return;
        var eset = uniqSorted(t.tones.filter(function (_, i) { return i !== 2; }).map(function (x) { return x[0] % 12; }));
        if (eset.length !== S.length) return;
        S.forEach(function (R) {
          for (var i = 0; i < eset.length; i++) if (S.indexOf((R + eset[i]) % 12) < 0) return;
          out.push({ pc: R, type: t });
        });
      });
    }
    return out;
  }
  function choose(cands, frets) {
    if (!cands.length) return null;
    var bass = TUNING[0] + frets[0], bassPc = bass % 12;
    for (var i = 1; i < frets.length; i++) {
      var p = TUNING[i] + frets[i];
      if (p < bass) { bass = p; bassPc = p % 12; }
    }
    cands.sort(function (a, b) {
      var ma = MINOR_IDS.indexOf(a.type.id) >= 0 ? 0 : 1;
      var mb = MINOR_IDS.indexOf(b.type.id) >= 0 ? 0 : 1;
      if (ma !== mb) return ma - mb;
      var ti = TYPES.indexOf(a.type) - TYPES.indexOf(b.type);
      if (ti) return ti;
      return (a.pc === bassPc ? -1 : 0) - (b.pc === bassPc ? -1 : 0);
    });
    return cands[0];
  }
  function rootNameOf(pc) {
    var list = ENHARMONIC[pc];
    if (!list) return PC_LETTER[pc] || '';
    return state.spelling === 'sharp' ? list[0] : list[1];
  }
  function parseFrets(str) {
    var parts = String(str || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length !== 6) return null;
    var out = [];
    for (var i = 0; i < 6; i++) {
      if (!/^\d{1,2}$/.test(parts[i])) return null;
      var v = Number(parts[i]);
      if (v > MAX_FRET) return null;
      out.push(v);
    }
    return out;
  }
  function updateFindVals() {
    for (var i = 0; i < 6; i++) {
      var el = document.getElementById('f' + i);
      if (el) findVals[i] = Number(el.value);
    }
  }
  function findFrets() {
    var out = document.getElementById('findOut');
    var c = choose(candidates(findVals.slice()), findVals);
    if (!c) {
      out.innerHTML = '<span class="find-err">No matching chord</span>';
      return null;
    }
    out.innerHTML = '<div class="find-hit-wrap">' +
      '<button class="chip active find-hit" id="findHit" type="button">' + rootNameOf(c.pc) + c.type.suffix + '</button>' +
      '<span class="find-hit-hint">tap to load it on the map</span></div>';
    return { pc: c.pc, qid: c.type.id };
  }
  function applyFind() {
    var sel = findFrets();
    if (!sel) return;
    setRoot(rootNameOf(sel.pc));
    state.quality = sel.qid;
    render();
    if (window.matchMedia('(max-width: 940px)').matches) {
      document.getElementById('infoPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    findFrets();
  }

  function updateSel() {
    var minor = MINOR_IDS.indexOf(state.quality) >= 0;
    var idx = minor ? MINOR_PCS.indexOf(state.rootPc) : MAJOR_PCS.indexOf(state.rootPc);
    var kind = minor ? 'min' : 'maj';
    var nodes = document.querySelectorAll('#circlePanel [data-kind]');
    for (var i = 0; i < nodes.length; i++) {
      var g = nodes[i];
      var on = g.getAttribute('data-kind') === kind && Number(g.getAttribute('data-i')) === idx;
      g.classList.toggle('sel', on);
    }
  }
  function renderCenter() {
    var t = typeOf(state.quality);
    document.getElementById('ctrName').innerHTML =
      '<tspan class="rt">' + state.rootName + '</tspan>' + t.suffix;
    document.getElementById('ctrNotes').textContent =
      chordNotes().map(function (n) { return n.name; }).join(' \u00b7 ');
  }
  function renderAcc() {
    var btn = document.getElementById('accBtn');
    var list = ENHARMONIC[state.rootPc];
    if (!list) { btn.style.visibility = 'hidden'; return; }
    btn.style.visibility = 'visible';
    btn.textContent = 'Spell as ' + list[state.spelling === 'sharp' ? 1 : 0];
  }
  function renderNotes() {
    document.getElementById('notes').innerHTML = chordNotes().map(function (n) {
      var isRoot = n.degree === 'root';
      return '<div class="note' + (isRoot ? ' root' : '') + '"><b>' + n.name + '</b><span>' + n.degree + '</span></div>';
    }).join('');
  }
  function renderChips() {
    var nodes = document.querySelectorAll('#chips .chip');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('active', nodes[i].getAttribute('data-id') === state.quality);
    }
  }
  var CANON = {
    maj: { '0': [-1,3,2,0,1,0], '9': [-1,0,2,2,2,0], '7': [3,2,0,0,0,3], '4': [0,2,2,1,0,0], '2': [-1,-1,0,2,3,2], '5': [1,3,3,2,1,1] },
    m: { '9': [-1,0,2,2,1,0], '4': [0,2,2,0,0,0], '2': [-1,-1,0,2,3,1] },
    '7': { '0': [-1,3,2,3,1,0], '9': [-1,0,2,0,2,0], '7': [3,2,0,0,0,1], '4': [0,2,0,1,0,0], '2': [-1,-1,0,2,1,2], '11': [-1,2,1,2,0,2] },
    maj7: { '0': [-1,3,2,0,0,0], '9': [-1,0,2,1,2,0], '7': [3,2,0,0,0,2], '4': [0,2,1,1,0,0], '2': [-1,-1,0,2,2,2], '5': [-1,-1,3,2,1,0] },
    m7: { '9': [-1,0,2,0,1,0], '4': [0,2,0,0,0,0], '2': [-1,-1,0,2,1,1], '11': [-1,2,0,2,0,2] },
    sus4: { '9': [-1,0,2,2,3,0], '4': [0,2,2,2,0,0], '2': [-1,-1,0,2,3,3], '7': [3,3,0,0,1,3] },
    sus2: { '9': [-1,0,2,2,0,0], '2': [-1,-1,0,2,3,0], '4': [0,2,4,4,0,0] },
    '6': { '0': [-1,3,2,2,1,0], '9': [-1,0,2,2,2,2], '2': [-1,-1,0,2,0,2], '7': [3,2,0,0,0,0] },
    m6: { '9': [-1,0,2,2,1,2], '2': [-1,-1,0,2,0,1], '4': [0,2,2,0,2,0] },
    add9: { '0': [-1,3,2,0,3,3], '4': [0,2,2,1,0,2], '9': [-1,0,2,4,2,0] },
    '9': { '0': [-1,3,2,3,3,-1] },
    m9: { '0': [-1,3,1,3,3,-1] },
    maj9: { '0': [-1,3,2,4,3,-1] },
    dim: { '0': [-1,3,4,5,4,-1] },
    dim7: { '0': [-1,3,4,2,4,-1] },
    aug: { '0': [-1,3,2,1,1,0] },
    m7b5: { '0': [-1,3,4,3,4,-1], '11': [-1,2,3,2,3,-1] },
    '7sus4': { '0': [-1,3,3,3,1,1], '2': [-1,-1,0,2,1,3] }
  };
  function shapeRank(frets) {
    var fretted = [], open = 0, sounding = 0, bass = -1, bassPc = -1;
    for (var i = 0; i < 6; i++) {
      var v = frets[i];
      if (v > 0) fretted.push(v);
      if (v === 0) open++;
      if (v >= 0) {
        sounding++;
        var p = TUNING[i] + v;
        if (bass < 0 || p < bass) { bass = p; bassPc = p % 12; }
      }
    }
    var minF = fretted.length ? Math.min.apply(null, fretted) : 0;
    var maxF = fretted.length ? Math.max.apply(null, fretted) : 0;
    return {
      rootBass: bassPc === ((state.rootPc % 12) + 12) % 12 ? 0 : 1,
      minF: minF,
      fingers: uniqSorted(fretted).length,
      span: maxF - minF,
      open: -open,
      sounding: -sounding,
      pattern: frets.join(',')
    };
  }
  function sortShapes(shapes) {
    var group = CANON[state.quality];
    var want = group ? group[state.rootPc] : null;
    var wantKey = want ? want.join(',') : null;
    var keyed = shapes.map(function (f) {
      return { f: f, canon: wantKey && f.join(',') === wantKey ? 0 : 1, r: shapeRank(f) };
    });
    keyed.sort(function (a, b) {
      if (a.canon !== b.canon) return a.canon - b.canon;
      var x = a.r, y = b.r;
      if (x.rootBass !== y.rootBass) return x.rootBass - y.rootBass;
      if (x.minF !== y.minF) return x.minF - y.minF;
      if (x.sounding !== y.sounding) return x.sounding - y.sounding;
      if (x.open !== y.open) return x.open - y.open;
      if (x.fingers !== y.fingers) return x.fingers - y.fingers;
      if (x.span !== y.span) return x.span - y.span;
      return x.pattern < y.pattern ? -1 : (x.pattern > y.pattern ? 1 : 0);
    });
    return keyed.map(function (k) { return k.f; });
  }
  function renderShapes() {
    var t = typeOf(state.quality);
    var name = state.rootName + t.suffix;
    var shapes = findShapes(state.rootPc, state.quality, false);
    var stretch = false;
    if (!shapes.length) {
      shapes = findShapes(state.rootPc, state.quality, true);
      stretch = shapes.length > 0;
    }
    shapes = sortShapes(shapes);
    document.getElementById('shapeName').textContent = name;
    document.getElementById('shapeCount').textContent =
      shapes.length + ' ' + (shapes.length === 1 ? 'way' : 'ways') + ' to play' +
      (stretch ? ' \u00b7 stretch voicings' : '');
    var shown = shapes;
    if (!state.showAll) {
      shown = shown.slice(0, 15);
    } else {
      shown = shown.slice(0, 60);
    }
    var allBtn = document.getElementById('allBtn');
    if (allBtn) allBtn.textContent = state.showAll ? 'Show common' : 'Show all';
    document.getElementById('shapes').innerHTML = shown.length
      ? (shown.map(function (f, i) {
          var svg = diagramSVG(f);
          var label = f.map(function (v) { return v < 0 ? 'x' : String(v); }).join(' ');
          return '<div class="shape" style="animation-delay:' + Math.min(i * 25, 350) + 'ms" data-frets="' + label + '">' +
            svg + fretLabelsSVG(f) + '</div>';
        }).join('') + ((shapes.length > shown.length) ? '<div class="more">Showing top ' + shown.length + ' of ' + shapes.length + '</div>' : ''))
      : '<div class="empty">No six-string voicing found below the 12th fret.</div>';
  }
  function render() {
    updateSel();
    renderCenter();
    renderAcc();
    renderNotes();
    renderChips();
    renderShapes();
  }

  buildCircle();
  buildChips();
  document.getElementById('circlePanel').addEventListener('click', function (e) {
    if (e.target.closest('#findHit')) { applyFind(); return; }
    var g = e.target.closest('[data-kind]');
    if (g) pick(g);
  });
  document.getElementById('circlePanel').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var g = e.target.closest('[data-kind]');
    if (g) { e.preventDefault(); pick(g); }
  });
  document.getElementById('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (!c) return;
    state.quality = c.getAttribute('data-id');
    state.showAll = false;
    render();
  });
  var allBtn = document.getElementById('allBtn');
  if (allBtn) {
    allBtn.addEventListener('click', function () {
      state.showAll = !state.showAll;
      allBtn.textContent = state.showAll ? 'Show common' : 'Show all';
      render();
    });
  }
  render();
})();
</script>
</body>
</html>
